name: probe-data
# Checks which order book data sources the Actions runner can reach.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/probe-data.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          for u in \
            "https://api.binance.com/api/v3/depth?symbol=BTCUSDT&limit=5" \
            "https://data-api.binance.vision/api/v3/depth?symbol=BTCUSDT&limit=5" \
            "https://fapi.binance.com/fapi/v1/depth?symbol=BTCUSDT&limit=5" \
            "https://api.binance.us/api/v3/depth?symbol=BTCUSDT&limit=5" \
            "https://data.binance.vision/data/futures/um/daily/bookDepth/BTCUSDT/BTCUSDT-bookDepth-2025-01-01.zip" \
            "https://datasets.tardis.dev/v1/binance/book_snapshot_25/2025/01/01/BTCUSDT.csv.gz" \
            "https://datasets.tardis.dev/v1/binance-futures/book_snapshot_25/2025/01/01/BTCUSDT.csv.gz" \
            "https://api.bybit.com/v5/market/orderbook?category=spot&symbol=BTCUSDT&limit=5" \
            "https://www.okx.com/api/v5/market/books?instId=BTC-USDT&sz=5" \
            "https://api.exchange.coinbase.com/products/BTC-USD/book?level=2" \
            "https://api.kraken.com/0/public/Depth?pair=XBTUSD&count=5" ; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -m 30 -r 0-2000 "$u")
            echo "$code  $u"
            head -c 200 /tmp/out | tr -d '\0' ; echo; echo
          done
      - name: Probe websockets
        run: |
          pip install -q websockets
          python - <<'PY'
          import asyncio, websockets
          urls = ["wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms",
                  "wss://data-stream.binance.vision/ws/btcusdt@depth20@100ms",
                  "wss://stream.binance.us:9443/ws/btcusdt@depth20@100ms",
                  "wss://stream.bybit.com/v5/public/spot"]
          async def probe(u):
              try:
                  async with websockets.connect(u, open_timeout=15) as ws:
                      if "bybit" in u:
                          await ws.send('{"op":"subscribe","args":["orderbook.50.BTCUSDT"]}')
                      msg = await asyncio.wait_for(ws.recv(), 15)
                      print("OK  ", u, str(msg)[:150])
              except Exception as e:
                  print("FAIL", u, repr(e)[:150])
          async def main():
              for u in urls: await probe(u)
          asyncio.run(main())
          PY
